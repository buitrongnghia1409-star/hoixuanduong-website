<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hồi Xuân Đường</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 600px; width: 100%; padding: 40px; }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.2); }
        textarea { resize: vertical; min-height: 100px; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .success { background: #10b981; color: white; padding: 15px; border-radius: 5px; text-align: center; display: none; margin-bottom: 20px; }
        .success.show { display: block; }
        .error { background: #ef4444; color: white; padding: 15px; border-radius: 5px; text-align: center; display: none; margin-bottom: 20px; }
        .error.show { display: block; }
        #loginForm { max-width: 300px; margin: 0 auto; }
        #adminPanel { display: none; }
        .logout-btn { background: #ef4444 !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login -->
        <div id="loginForm">
            <h1>🔐 Đăng Nhập</h1>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>
            <button onclick="login()">Đăng Nhập</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel">
            <h1>📋 Quản Lý Nội Dung</h1>
            <button class="logout-btn" onclick="logout()" style="margin-bottom: 20px;">Đăng xuất</button>

            <div id="successMsg" class="success"></div>
            <div id="errorMsg" class="error"></div>

            <div id="loadingMsg" style="text-align: center; color: #667eea;">Đang tải dữ liệu...</div>

            <div id="formContainer" style="display: none;">
                <div class="form-group">
                    <label>📌 Tên phòng khám</label>
                    <input type="text" id="clinic_name" placeholder="Hồi Xuân Đường">
                </div>

                <div class="form-group">
                    <label>📝 Giới thiệu</label>
                    <textarea id="introduction" placeholder="Nhập giới thiệu"></textarea>
                </div>

                <div class="form-group">
                    <label>📞 Số điện thoại</label>
                    <input type="text" id="phone" placeholder="0912 994 888">
                </div>

                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="info@hoixuanduong.com">
                </div>

                <div class="form-group">
                    <label>📍 Địa chỉ</label>
                    <textarea id="address" placeholder="Nhập địa chỉ"></textarea>
                </div>

                <div class="form-group">
                    <label>🕒 Giờ làm việc</label>
                    <input type="text" id="business_hours" placeholder="8:00 - 20:00">
                </div>

                <button onclick="saveData()">💾 Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://epdjnjcfzxhllklusmet.supabase.co',
            'sb_publishable_pIjbFKuEUhUGxoMZvB6AsQ_dlpJUSO_'
        );

        const adminPassword = 'hoixuanduong2026';

        function login() {
            const pwd = document.getElementById('password').value;
            if (pwd === adminPassword) {
                localStorage.setItem('logged_in', 'true');
                showAdmin();
            } else {
                showError('Mật khẩu không đúng!');
            }
        }

        function logout() {
            localStorage.removeItem('logged_in');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('password').value = '';
        }

        function showAdmin() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        }

        async function loadData() {
            try {
                const { data, error } = await supabase
                    .from('clinic_data')
                    .select('*')
                    .eq('id', 1)
                    .single();

                if (error) throw error;

                if (data) {
                    document.getElementById('clinic_name').value = data.clinic_name || '';
                    document.getElementById('introduction').value = data.introduction || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('address').value = data.address || '';
                    document.getElementById('business_hours').value = data.business_hours || '';
                }

                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
            } catch (err) {
                showError('Lỗi: ' + err.message);
            }
        }

        async function saveData() {
            try {
                const { error } = await supabase
                    .from('clinic_data')
                    .update({
                        clinic_name: document.getElementById('clinic_name').value,
                        introduction: document.getElementById('introduction').value,
                        phone: document.getElementById('phone').value,
                        email: document.getElementById('email').value,
                        address: document.getElementById('address').value,
                        business_hours: document.getElementById('business_hours').value,
                        updated_at: new Date()
                    })
                    .eq('id', 1);

                if (error) throw error;

                showSuccess('✓ Dữ liệu đã được lưu thành công!');
            } catch (err) {
                showError('Lỗi khi lưu: ' + err.message);
            }
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        // Check if logged in
        if (localStorage.getItem('logged_in') === 'true') {
            showAdmin();
        }
    </script>
</body>
</html>
